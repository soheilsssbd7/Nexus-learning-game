name: CI

# NEXUS — خط لوله‌ی اصلی (docs/04-BUILD-PLAN.md تسک ۰.۵)
#   ۱) Godot headless: ایمپورت پروژه (اگر حتی یک .tscn/.gd خراب باشد اینجا می‌شکند) + تست‌های GUT
#   ۲) gdlint (gdtoolkit قفل‌شده) روی game/scripts و game/tests
#   ۳) اعتبارسنج داده‌ی محتوا: قابل‌حل‌بودن سطوح، ارجاع hint_id، قانون طلایی
#
# ریپو خصوصی است → دقیقه‌ی CI محدود: کش باینری Godot + concurrency (لغو runهای منسوخ).
# ساخت APK/AAB عمداً اینجا نیست؛ `android-export.yml` (فاز ۱۰) دستی اجرا می‌شود.

on:
  push:
    branches: [main, develop, "arena/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot-tests:
    name: Godot import + GUT (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: "Restore Godot cache"
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/nexus-godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: "Download Godot ${{ env.GODOT_VERSION }}"
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/nexus-godot
          curl -sSL --retry 3 --max-time 300 \
            -o ~/.cache/nexus-godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          (cd ~/.cache/nexus-godot && unzip -qo godot.zip)
          mv -f ~/.cache/nexus-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/.cache/nexus-godot/godot
          chmod +x ~/.cache/nexus-godot/godot
          rm -f ~/.cache/nexus-godot/godot.zip
          ~/.cache/nexus-godot/godot --version

      - name: "Import project"
        run: ~/.cache/nexus-godot/godot --headless --path game --import

      - name: "Run GUT test suite"
        run: |
          set -o pipefail
          GODOT=~/.cache/nexus-godot/godot
          # گارد کشف تست (ADR-033): «CI سبز» بی‌معنی است اگر همه‌ی فایل‌های تست اجرا نشوند.
          # تعداد فایل‌های test_*.gd روی دیسک باید با «Scripts» در خلاصه‌ی GUT برابر باشد؛
          # در صورت نابرابری یک بار با فهرست صریح `-gtest` تلاش می‌شود و بعد خطا می‌گیریم.
          found=$(find game/tests -name 'test_*.gd' -not -path '*/support/*' | wc -l)
          $GODOT --headless --path game \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gexit 2>&1 | tee gut.log
          status=${PIPESTATUS[0]}
          ran=$(grep -E '^Scripts' gut.log | tail -1 | grep -oE '[0-9]+' | head -1 || true)
          ran=${ran:-0}
          echo "GUT discovered scripts=$ran, files on disk=$found"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # لایه‌ی احتیاط: اگر exit code منتقل نشد، لاگ را بخوان
          if grep -Eq "Failing Tests?:[[:space:]]*[1-9]" gut.log; then
            echo "GUT reported failing tests but exited 0"; exit 1
          fi
          grep -Eq "Errors:[[:space:]]*[1-9]" gut.log && { echo "خطای engine/push_error در اجرا"; exit 1; } || true
          if [ "$ran" != "$found" ]; then
            # تشخیص را به‌صورت annotation می‌فرستیم؛ لاگ CI از این سندباکس قابل‌خواندن نیست
            ls game/tests/gut/ | sed 's|^|::notice::FILE |' | head -25
            grep -E "test_" gut.log | sed 's|^|::notice::GUTLOG |' | head -25
            echo "::error::GUT فقط $ran از $found فایل تست را اجرا کرد (کشف تست شکسته است)"
            exit 1
          fi

      - name: "Test summary as notice (خوانا در تب Checks)"
        if: always()
        run: |
          if [ -f gut.log ]; then
            msg=$(grep -E "^(Scripts|Tests|Passing Tests|Failing Tests|Errors|Time|Orphans)" gut.log | tr '\n' ' ' | tr -s ' ')
            files=$(find game/tests -name 'test_*.gd' -not -path '*/support/*' | wc -l)
            echo "::notice::GUT 4.7.2 ${msg:-no summary line found} | files_on_disk=$files"
          fi

      - name: "Annotate failures (قابل‌خواندن از API، بدون artifact)"
        if: failure()
        run: python3 tools/ci_annotate.py gut.log --title "GUT"

      - name: "Upload GUT log + junit"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            gut.log
            game/test-results.xml
          if-no-files-found: ignore

  backend:
    name: backend (typecheck + build + node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # تسک ۹.۱..۹.۵ — بک‌اند روی `pg-mem` تست می‌شود ⇒ نه Docker، نه Postgres ✓✗ پس این job
    # در همان CIِ Godot می‌آید و هزینه‌اش فقط `npm ci` است ✓ (اگر روزی Postgres واقعی لازم
    # شد، `services: postgres:` افزودنیِ همین job است، نه jobِ جدید ✓§۹)
    services:
      # DoD ۹.۲ می‌گوید «جداول در Postgres محلی/Docker ساخته می‌شوند» ✗✓ پس همین‌جا هم
      # موتورِ واقعی بالا می‌آید و مهاجرت **دوبار** اجرا می‌شود (بی‌ضرربودنِ migration ✓✓)؛
      # `pg-mem` برای تستِ منطق/SQL است و این برای «اسکیما روی Postgres واقعی» ✓ دو نقش، دو ابزار
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install (npm ci — قفل‌شده ✓)"
        run: npm ci --no-audit --no-fund
      - name: "typecheck + build (SQL هم باید به dist برسد ✓ scripts/copy-sql.mjs)"
        run: |
          set -o pipefail
          npm run typecheck
          npm run build
          test -f dist/src/db/schema.sql || { echo "build: schema.sql کپی نشد ✗"; exit 1; }
      - name: "migrate روی Postgres واقعی (DoD ۹.۲ — دو بار ⇒ idempotent ✓)"
        env:
          DATABASE_URL: postgres://postgres:nexus@localhost:5432/nexus
        run: |
          set -o pipefail
          # اجرای دوم **باید** بی‌ضرر باشد ✗✓ (خطا در دور دوم = مهاجرت idempotent نیست ⇒
          # همین یک خط، کلِ «بالا آمدنِ سرویس در محیط جدید» را قابل‌اتکا می‌کند ✓)
          npm run migrate
          npm run migrate
      - name: "tests (node:test + supertest + pg-mem)"
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log
      - name: "Annotate failures"
        if: failure()
        run: python3 ../tools/ci_annotate.py backend-test.log --title "backend"
      - name: "Upload log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore

  static-checks:
    name: gdlint + content validation
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ⚠ pyyaml هم اینجا نصب می‌شود: گیتِ check_ci_yaml سطح ۲ (parse کاملِ workflowها)
      #   را فقط «با PyYAML» می‌زند ✗✓ — بی‌آن، یک workflowِ شکسته از چنگِ گیت در می‌رود
      #   و پیامدش صفر job و صفر لاگ است (تجربۀ تلخِ همین فاز ✓✓)
      - run: python -m pip install --quiet "gdtoolkit==4.5.0" "pyyaml>=6"
      - name: "gdlint + content validation (log برای تشخیص)"
        run: |
          set -o pipefail
          {
            find game/scripts game/tests -name '*.gd' -print0 | xargs -0 -r gdlint
            python3 tools/validate_levels.py
          } 2>&1 | tee checks.log
      - name: "Annotate failures"
        if: failure()
        run: python3 tools/ci_annotate.py checks.log --title "checks"

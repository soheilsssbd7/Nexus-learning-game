; ---------------------------------------------------------------------------
; NEXUS — preset های خروجی | تسک ۱۰.۴ (docs/04 §۱۰.۴ · ADR-004 · ADR-009 · ADR-036)
; ---------------------------------------------------------------------------
; ⚠ این فایل **دست‌نویس** است ✓✗ نه خروجی ویرایشگر. دو پیامدِ عملی دارد:
;   ۱) Godot کلیدهای ناشناخته را بی‌صدا نادیده می‌گیرد ⇒ «سبز بودنِ گیت» یعنی **مقادیر** درست‌اند،
;      نه این‌که موتور نامِ کلید را می‌شناسد ✗✓؛ اثباتِ نهایی همان `apkanalyzer manifest print` است
;      که در `docs/smoke-checklist.md` §۲ آمده ✓ (پس گیت + دستگاه، دو لایه‌اند ✓).
;   ۲) اگر روزی پریست را با ویرایشگر باز و ذخیره کنی، Godot همهٔ کلیدهای پیش‌فرض را می‌نویسد ✓
;      ⇒ **فایل را همان‌طور commit کن** و بعد `python3 tools/validate_levels.py` را بگیر ✓
;         (گیتِ `check_export_config` مقدارها را می‌پاید ✓ و `*.import`/`android/build/` ignore‌اند ✓)
;
; نام پکیج: `com.nexus.balancerealm` — `docs/04` می‌گوید `com.<studio>.nexus` و studio هنوز
; اعلام‌نشده است ✗✓ ⇒ این فرضِ من در ADR-066 ثبت شد و **باید قبل از ۱۱.۳ تأیید شود** ✓✗ چون
; بعد از اولین آپلودِ AAB به Play، تغییرِ applicationId یعنی «اپِ دیگر» ✗✗.
;
; هیچ رمزی این‌جا نیست ✓ (ADR-004): `export_credentials.cfg` در `.gitignore` است ✓ و کلیدِ امضا
; فقط از GitHub Secrets خوانده می‌شود ✓.
; ---------------------------------------------------------------------------

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
; ⚠ ADR-036: سطوح با `FileAccess` از `res://data/levels/**.json` خوانده می‌شوند ⇒ اگر این الگو
; نباشد، بازی روی دستگاه **بدون هیچ سطحی** بالا می‌آید (`level_load_failed`) و CI/دسکتاپ سبزند ✗✗
; (کلیدِ درستِ Godot 4 همین `include_filter` است ✓✗ ADR-036 اسمِ `export/non_resource_files` را
; نوشته بود که وجود ندارد ⇒ همان دور اصلاح شد ✓✓ ADR-066)
export_filter="all_resources"
include_filter="*.json"
; ⚠ GUT و ۴۹ فایلِ تست نباید داخل APK بروند ✗✓ (حجمِ بی‌دلیل + «کدِ بی‌مصرف» که اسکنرهای
;   فروشگاه دوست ندارند ✓§۱۱.۲) ⇒ این دو الگو لازم‌اند ✓✗ خودِ **صورتِ الگو** (یک‌ستاره‌ای یا
;   `**`) در اولین export واقعی تأیید می‌شود ✓ و چک‌لیست `docs/families-compliance.md` §۴ سطرش ⚙
;   است، نه ✅ — ادعای بی‌آزمون نداریم ✓✓
exclude_filter="addons/gut/*,tests/*"
export_path="../build/android/nexus-debug.apk"

[preset.0.options]

; targetSdk 36 الزامِ Google Play از ۳۱ اوت ۲۰۲۶ است ✓ADR-009 — و در Godot 4 مقدارِ
; `gradle_build/target_sdk` **بی‌gradle build بی‌اثر است** ✗✓ (قالبِ پیش‌ساخته، SDK خودش را می‌برد)
; ⇒ پس `use_gradle_build=true` یک انتخاب نیست، شرطِ لازمِ ADR-009 است ✓✓
gradle_build/use_gradle_build=true
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.nexus.balancerealm"
package/name="Balance Realm"
package/signed=true
; فقط دو مجوز ✓§۹/ADR-009 — و این‌ها در manifestِ ما نوشته می‌شوند، نه این‌جا ✗✓
; (`game/android/AndroidManifest.tmpl.xml` ✓ منبعِ حقیقت ✓ و workflow کنارش می‌گذارد ✓)
; بدون `ACCESS_*` موقعیت، بدون `READ_*`، بدون هیچ SDKِ شخص ثالث ✓
; ⚠ عمداً هیچ کلیدِ «مطمئن‌نبودم» در این فایل نیست ✓✗ (قالبِ `paths`/`build-tools` در Godot 4
;   در *تنظیمات ویرایشگر* زندگی می‌کند نه در پریست ⇒ نوشتنش این‌جا یعنی کلیدِ مرده ✓؛ پس CI
;   آن‌ها را با متغیرهای محیطی به gradle می‌دهد ✓ `android-export.yml`)
; ⚠ AAB یا APK: تصمیمِ Godot از **پسوندِ مسیرِ خروجی** است ✓✗ این در اولین اجرای واقعیِ
;   `android-export.yml` تأیید شود (ادعای بی‌آزمون نداریم ✓) — تا آن موقع، `docs/05` این را
;   «⏳» می‌شناسد ✓ و `export_path` بالا عمداً `.apk` است ✓

; ===========================================================================
; preset.1 — Web (تسک ۱۲.۴ · ADR-068)
; ---------------------------------------------------------------------------
; چرا اصلاً؟ تا «محصول» روی GitHub Pages **قابل‌اجرا** هم باشد، نه فقط خواندنی ✓✗ و اگر
; حجمِ wasm از سقفِ فایلِ Pages رد شود، سایت صریح می‌گوید «artifact» ✓ (قاعده: کم‌کردنِ ادعا
; با کم‌کردنِ حرف نیست ✗ با شرط گذاشتن در ابزار است ✓).
; ⚠ عمداً **کمترینِ کلیدِ مطمئن** ✓§ADR-066: کلیدهایِ حدسی در preset بی‌صدا نادیده گرفته
;   می‌شوند ⇒ فایلِ درست‌نما با رفتارِ غلط ✗✗ بدترین حالت. پس هرچه را مطمئن نیستم اینجا
;   نمی‌نویسم و در کامنت می‌گویم چه چیزی را ویرایشگر/اولین export باید ثابت کند ✓:
;     • `variant/thread_support` — برای Pages **باید false** باشد (بدونِ COOP/COEP،
;       SharedArrayBuffer در دسترس نیست ✗) اما نامِ دقیقِ کلید را در این نسخه نمی‌دانم ⇒
;       با ویرایشگر (Project → Export → Web) تیکِ «Thread Support» را بردارید ✓✗ گیتِ
;       `check_export_config` **این سطرِ کامنت** را هم می‌سنجد تا یادداشتِ باز، باز بماند ✓
;     • PWA/icon/audio/… ⇒ پیش‌فرض‌های موتور ✓ (اولین export واقعی نشان می‌دهد)
; ===========================================================================

[preset.1]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gut/*,tests/*"
export_path="../build/web/index.html"

[preset.1.options]

; ⚠ **عمداً خالی است** ✓✗ لحظه‌ای که این سطر نوشته می‌شد، دو کلیدِ «مطمئن‌نشدۀ»
;   `variant/extensions_support` و `progressive_web_app/enabled` اینجا بود ✗✗ و همان اشتباهِ
;   ADR-036 (کلیدِ `export/non_resource_files`) را تکرار می‌کرد ✓✗ کلیدِ غلط در preset **خطا
;   نمی‌دهد** — بی‌صدا نادیده گرفته می‌شود ⇒ «PWA خاموش است» یک دروغِ بی‌مدرک می‌شد ✓
;   پس: بخشِ خالی = همه‌چیز پیش‌فرضِ موتور ✓ و آنچه باید تغییر کند (Thread Support ✗ برای Pages)
;   در کامنتِ بالای همین preset گفته شده و **با ویرایشگر/اولین export واقعی** ثبت می‌شود ✓✓

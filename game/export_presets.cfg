;   در *تنظیمات ویرایشگر* زندگی می‌کند نه در پریست ⇒ نوشتنش این‌جا یعنی کلیدِ مرده ✓؛ پس CI
;   آن‌ها را با متغیرهای محیطی به gradle می‌دهد ✓ `android-export.yml`)
; ⚠ AAB یا APK: تصمیمِ Godot از **پسوندِ مسیرِ خروجی** است ✓✗ این در اولین اجرای واقعیِ
;   `android-export.yml` تأیید شود (ادعای بی‌آزمون نداریم ✓) — تا آن موقع، `docs/05` این را
